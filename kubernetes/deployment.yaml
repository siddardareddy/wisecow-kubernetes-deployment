
apiVersion: apps/v1
kind: Deployment

metadata:
  name: wisecow-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: wisecow

  template:
    metadata:
      labels:
        app: wisecow

    spec:
      containers:
        - name: wisecow
          image: wisecow:v3
          imagePullPolicy: Never

          ports:
            - containerPort: 4499
              name: http

          startupProbe:
            tcpSocket:
              port: 4499
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            tcpSocket:
              port: 4499
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 4499
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
